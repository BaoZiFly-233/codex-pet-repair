[package]
name = "pet-repair"
version = "1.2.0"
edition = "2021"
license = "MIT"
description = "A small native Windows utility to restore Codex overlay interaction"
build = "build.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = { version = "=0.29.0", default-features = false, features = ["handshake"] }
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation", "Win32_Security", "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp", "Win32_System_LibraryLoader",
  "Win32_Storage_Packaging_Appx", "Win32_System_StationsAndDesktops",
  "Win32_UI_WindowsAndMessaging", "Win32_UI_Accessibility",
  "Win32_UI_Shell", "Win32_Networking_WinHttp", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_UI_HiDpi", "Win32_System_Com",
  "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi",
  "Win32_System_Registry", "Win32_System_RemoteDesktop",
  "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_System_IO",
  "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_SystemInformation", "Win32_System_Time"
] }

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = "symbols"
